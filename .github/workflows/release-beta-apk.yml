name: Build & Release Beta APK

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release Version / Name'
        required: true
        default: 'v1.0.0-beta'
      release_notes:
        description: 'Release Notes / Changelog'
        required: false
        default: 'Mitra Android Beta Build'
  push:
    tags:
      - 'v*-beta*'
      - 'beta-*'
      - 'v*'

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle 8.7 Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Setup Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "Generating google-services.json for CI build..."
            echo '{"project_info":{"project_number":"123456789","project_id":"mitra-ai","storage_bucket":"mitra-ai.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456789","android_client_info":{"package_name":"com.mitra.app"}},"api_key":[{"current_key":"AIzaSyDummyKeyForCI"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Mitra-Beta.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mitra-Beta-APK
          path: release-output/Mitra-Beta.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ inputs.release_name || github.ref_name }}
          name: ${{ inputs.release_name || github.ref_name }}
          body: ${{ inputs.release_notes || 'Automated Mitra Beta Build' }}
          prerelease: true
          files: |
            release-output/Mitra-Beta.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
